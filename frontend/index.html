<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F6F1" />
    <meta name="description" content="Eat The Frog — A focused task manager built on one proven principle: tackle your hardest task first. Sign up free." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Eat The Frog" />
    <title>Eat The Frog — Task Manager</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('etf_theme');
          var user = null;
          var savedUser = localStorage.getItem('etf_user');
          if (savedUser) {
            user = JSON.parse(savedUser);
          }
          var theme = (user && user.theme) || savedTheme || 'system';
          var resolvedTheme = theme;
          if (theme === 'system') {
            resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolvedTheme);
          console.log('[THEME] HTML pre-paint application:', theme, '-> resolved:', resolvedTheme);
        } catch (e) {
          console.error('[THEME] HTML pre-paint error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
